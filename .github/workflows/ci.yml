name: VaakKavach CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Flutter & Static Web Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Flutter Codebase
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Verify Web Directory Assets
        run: |
          test -f website/index.html || exit 1
          test -f website/assets/logo.png || exit 1
          test -f website/css/variables.css || exit 1
          test -f website/js/three_scene.js || exit 1
          test -f website/js/pixi_spectrogram.js || exit 1
          test -f website/js/audio_synth.js || exit 1
          test -f website/js/anime_effects.js || exit 1
          test -f website/js/react_components.js || exit 1
          echo "All dynamic web assets verified."
